[project]
name = "opensource-ai-workshop-tools"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
]

[project.scripts]
workshopctl = "workshop_tools.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["workshop_tools"]

[tool.uv]
package = true
