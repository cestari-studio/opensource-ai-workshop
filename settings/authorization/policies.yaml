schemaVersion: 1.0.0

policies:
  - id: generation-invoke
    effect: allow
    permission: generation.invoke
    roles:
      - member
      - developer
      - operator
      - workspace_admin
      - tenant_admin
      - master
    minimumLevel: 20
    scope:
      tenantIds:
        - "*"
      workspaceIds:
        - "*"

  - id: generation-codegen
    effect: allow
    permission: generation.codegen
    roles:
      - developer
      - operator
      - workspace_admin
      - tenant_admin
      - master
    minimumLevel: 30
    scope:
      tenantIds:
        - "*"
      workspaceIds:
        - "*"

